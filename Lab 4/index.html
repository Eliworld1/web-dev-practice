<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Volunteer Interest Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Volunteer With Us</h1>
    <p>Interested in supporting our community? Complete the form below to explore volunteer opportunities.</p>

    <!-- This is a practice form. It does not send or save information. -->
    <form id="volunteerForm" novalidate>
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" name="fullName">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="interest">Area of Interest:</label>
        <select id="interest" name="interest">
            <option value="Community Outreach">Community Outreach</option>
            <option value="Event Support">Event Support</option>
            <option value="Youth Mentoring">Youth Mentoring</option>
        </select>

        <button type="submit">Submit Interest</button>
    </form>

    <p id="result"></p> 

    <script src="volunteer.js"></script>
</body>
</html>
